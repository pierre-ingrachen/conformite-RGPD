[project]
name = "conformite-rgpd"
version = "0.1.0"
description = "Pipeline d'analyse de conformite AI Act / RGPD"
requires-python = ">=3.11"
# Dependances d'execution (identiques a requirements.txt, utilise par Azure/Oryx). Les
# dependances de test sont dans requirements-dev.txt.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.30,<2.0",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
